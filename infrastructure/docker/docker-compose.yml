# =============================================================================
# EduTech AI Platform — Local Development Docker Compose
# =============================================================================
# Prerequisites: copy .env.example to .env and fill all values
# Usage:
#   docker compose --env-file ../../.env up -d
#   docker compose --env-file ../../.env down -v   (removes volumes too)
# =============================================================================

services:

  #------------------------------------------------------------------------------
  # PostgreSQL — NATIVE (NOT Docker)
  # Primary DB: native postgresql@16 via Homebrew on localhost:5432
  #   Start : brew services start postgresql@16
  #   Verify: /usr/local/Cellar/postgresql@16/*/bin/pg_isready -h localhost
  #   psql  : PGPASSWORD="<POSTGRES_ROOT_PASSWORD>" \
  #             /usr/local/Cellar/postgresql@16/*/bin/psql \
  #             -h localhost -U edutech_root -d postgres
  #   Data  : managed by Homebrew (/usr/local/var/postgresql@16)
  #   Init  : schema/user init already applied (13 databases created)
  # ⛔ Do NOT start edutech-postgres Docker container — port 5432 is taken by native.
  # This Docker service definition is kept for reference / cloud migration only.
  #------------------------------------------------------------------------------
  # postgres:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.postgres
  #   image: edutech-postgres:local
  #   container_name: edutech-postgres
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_ROOT_USER}
  #     POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
  #   ports:
  #     - "${POSTGRES_PORT}:5432"
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #     - ./init-db:/docker-entrypoint-initdb.d:ro
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ROOT_USER}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #     start_period: 20s
  #   networks:
  #     - edutech-network

  #------------------------------------------------------------------------------
  # Redis — NATIVE (NOT Docker)
  # Primary Redis: native redis 8.x via Homebrew on localhost:6379
  #   Start      : brew services start redis
  #   Config     : /usr/local/etc/redis.conf (requirepass set via REDIS_PASSWORD)
  #   Health     : redis-cli -a <REDIS_PASSWORD> ping
  # ⛔ Do NOT start edutech-redis Docker container — port 6379 is taken by native.
  # This Docker service definition is kept for reference / cloud migration only.
  #------------------------------------------------------------------------------
  # redis:
  #   image: redis:7-alpine
  #   container_name: edutech-redis
  #   restart: unless-stopped
  #   command: >
  #     redis-server
  #     --requirepass ${REDIS_PASSWORD}
  #     --appendonly yes
  #     --appendfsync everysec
  #   ports:
  #     - "${REDIS_PORT}:6379"
  #   volumes:
  #     - redis-data:/data
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 5
  #   networks:
  #     - edutech-network

  #------------------------------------------------------------------------------
  # Kafka — NATIVE (NOT Docker)
  # Primary Kafka: native kafka 4.2.0 via Homebrew KRaft mode on localhost:9092
  #   Config     : /usr/local/etc/kafka/kraft/server.properties
  #   CLUSTER_ID : sBhN79PnQiyZj7rDgLXtGA   (fixed — do not change without wipe)
  #   CONTROLLER : localhost:9099  (9093/9094 taken by assess-svc / performance-svc)
  #   Log dir    : /usr/local/var/lib/kafka-logs
  #   LaunchAgent: ~/Library/LaunchAgents/com.edutech.kafka-native.plist
  #   Start      : launchctl load ~/Library/LaunchAgents/com.edutech.kafka-native.plist
  #   Stop       : launchctl unload ~/Library/LaunchAgents/com.edutech.kafka-native.plist
  #   Topics     : /usr/local/Cellar/kafka/4.2.0/libexec/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list
  # ⛔ Do NOT start edutech-kafka Docker container — port 9092 is taken by native.
  # This Docker service definition is kept for reference / cloud migration only.
  #------------------------------------------------------------------------------
  # kafka:
  #   image: apache/kafka:3.7.0
  #   container_name: edutech-kafka
  #   restart: unless-stopped
  #   environment:
  #     KAFKA_NODE_ID: ${KAFKA_NODE_ID}
  #     KAFKA_PROCESS_ROLES: broker,controller
  #     KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:29092
  #     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_EXTERNAL_PORT},INTERNAL://kafka:29092
  #     KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
  #     KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  #     KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  #     KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_NODE_ID}@localhost:9093
  #     CLUSTER_ID: sBhN79PnQiyZj7rDgLXtGA
  #     KAFKA_AUTO_CREATE_TOPICS_ENABLE: ${KAFKA_AUTO_CREATE_TOPICS}
  #     KAFKA_NUM_PARTITIONS: ${KAFKA_DEFAULT_PARTITIONS}
  #     KAFKA_DEFAULT_REPLICATION_FACTOR: ${KAFKA_DEFAULT_REPLICATION_FACTOR}
  #     KAFKA_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS}
  #     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  #     KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
  #     KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  #   ports:
  #     - "${KAFKA_EXTERNAL_PORT}:9092"
  #   volumes:
  #     - kafka-data:/var/lib/kafka/data
  #   networks:
  #     - edutech-network

  # ---------------------------------------------------------------------------
  # Kafka UI — browser-based topic/consumer group management (dev only)
  # Connects to NATIVE Kafka on host.docker.internal:9092 (not Docker kafka).
  # ---------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: edutech-kafka-ui
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      KAFKA_CLUSTERS_0_NAME: ${KAFKA_UI_CLUSTER_NAME}
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: host.docker.internal:9092
    ports:
      - "${KAFKA_UI_PORT}:8080"
    networks:
      - edutech-network
  #------------------------------------------------------------------------------
  # MinIO S3 — BACKUP ONLY
  # Primary S3: native MinIO via Homebrew launchd
  #   API     : http://localhost:9002   (MINIO_ENDPOINT in .env)
  #   Console : http://localhost:9003
  #   Data    : /usr/local/var/minio-native
  #   LaunchAgent: ~/Library/LaunchAgents/com.edutech.minio-native.plist
  #   If down : launchctl load ~/Library/LaunchAgents/com.edutech.minio-native.plist
  #   Bucket  : edutech-library (created, contains center storage folders)
  #   mc alias: mc alias set local http://localhost:9002 minioadmin minioadmin123 --api s3v4
  #
  # This Docker MinIO is BACKUP on port 9000/9001 (not started by default).
  # To switch to Docker MinIO: set MINIO_ENDPOINT=http://localhost:9000 in .env
  #------------------------------------------------------------------------------
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"    # API endpoint (S3-compatible) — BACKUP
      - "9001:9001"    # Web console UI — BACKUP
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  #------------------------------------------------------------------------------
  # pgAdmin — NATIVE macOS app (NOT Docker)
  # Primary pgAdmin: /Applications/pgAdmin 4.app (v9.13 already installed)
  #   Open    : open -a "pgAdmin 4"
  #   Add server: host=localhost, port=5432, user=edutech_root, password=<POSTGRES_ROOT_PASSWORD>
  # ⛔ Do NOT start edutech-pgadmin Docker container — use native macOS app instead.
  # This Docker service definition is kept for reference / cloud migration only.
  #------------------------------------------------------------------------------
  # pgadmin:
  #   image: dpage/pgadmin4:8
  #   container_name: edutech-pgadmin
  #   restart: unless-stopped
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"
  #   environment:
  #     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
  #     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
  #   ports:
  #     - "${PGADMIN_PORT}:80"
  #   networks:
  #     - edutech-network

  # ---------------------------------------------------------------------------
  # Redis Commander — Redis GUI (dev only)
  # Connects to NATIVE Redis on host.docker.internal:6379 (not Docker redis).
  # ---------------------------------------------------------------------------
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: edutech-redis-commander
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_HOSTS: local:host.docker.internal:6379:0:${REDIS_PASSWORD}
    ports:
      - "${REDIS_COMMANDER_PORT}:8081"
    networks:
      - edutech-network

  #------------------------------------------------------------------------------
  # MailHog — NATIVE (NOT Docker)
  # Primary MailHog: native mailhog 1.0.1 via Homebrew on localhost:1025/8025
  #   SMTP      : localhost:1025
  #   Web UI    : http://localhost:8025
  #   LaunchAgent: ~/Library/LaunchAgents/com.edutech.mailhog-native.plist
  #   Start     : launchctl load ~/Library/LaunchAgents/com.edutech.mailhog-native.plist
  #   Stop      : launchctl unload ~/Library/LaunchAgents/com.edutech.mailhog-native.plist
  # ⛔ Do NOT start edutech-mailhog Docker container — ports 1025/8025 taken by native.
  # This Docker service definition is kept for reference / cloud migration only.
  #------------------------------------------------------------------------------
  # mailhog:
  #   image: mailhog/mailhog:latest
  #   container_name: edutech-mailhog
  #   restart: unless-stopped
  #   ports:
  #     - "${MAILHOG_SMTP_PORT:-1025}:1025"
  #     - "${MAILHOG_UI_PORT:-8025}:8025"
  #   networks:
  #     - edutech-network

volumes:
  # postgres-data: UNUSED — Postgres runs natively via Homebrew postgresql@16
  # postgres-data:
  #   name: edutech-postgres-data
  # redis-data: UNUSED — Redis runs natively via Homebrew redis
  # redis-data:
  #   name: edutech-redis-data
  # kafka-data: UNUSED — Kafka runs natively via Homebrew (KRaft, logs in /usr/local/var/lib/kafka-logs)
  # kafka-data:
  #   name: edutech-kafka-data
  minio_data:
    name: edutech-s3-data    # backup Docker MinIO only; native MinIO uses /usr/local/var/minio-native

networks:
  edutech-network:
    name: edutech-network
    driver: bridge
