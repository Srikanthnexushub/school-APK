spring:
  application:
    name: ${API_GATEWAY_NAME}
  threads:
    virtual:
      enabled: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED}

  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenish-rate: ${GATEWAY_RATE_LIMIT_REPLENISH_RATE}
            redis-rate-limiter.burst-capacity: ${GATEWAY_RATE_LIMIT_BURST_CAPACITY}
            redis-rate-limiter.requested-tokens: ${GATEWAY_RATE_LIMIT_REQUESTED_TOKENS}
      routes:
        - id: auth-svc
          uri: ${AUTH_SVC_URI}
          predicates:
            - Path=/api/v1/auth/**
        - id: auth-svc-otp
          uri: ${AUTH_SVC_URI}
          predicates:
            - Path=/api/v1/otp/**
        - id: auth-svc-captcha
          uri: ${AUTH_SVC_URI}
          predicates:
            - Path=/api/v1/captcha/**
        - id: parent-svc
          uri: ${PARENT_SVC_URI}
          predicates:
            - Path=/api/v1/parents/**
        - id: parent-svc-copilot
          uri: ${PARENT_SVC_URI}
          predicates:
            - Path=/api/v1/copilot/**
        - id: center-svc
          uri: ${CENTER_SVC_URI}
          predicates:
            - Path=/api/v1/centers/**
        - id: center-svc-jobs
          uri: ${CENTER_SVC_URI}
          predicates:
            - Path=/api/v1/jobs/**
        - id: center-svc-banners
          uri: ${CENTER_SVC_URI}
          predicates:
            - Path=/api/v1/banners/**
        - id: center-svc-library
          uri: ${CENTER_SVC_URI}
          predicates:
            - Path=/api/v1/library/**
        - id: assess-svc-assignments
          uri: ${ASSESS_SVC_URI}
          predicates:
            - Path=/api/v1/assignments/**
        - id: assess-svc-student-assignments
          uri: ${ASSESS_SVC_URI}
          predicates:
            - Path=/api/v1/students/*/assignments
        - id: student-profile-svc
          uri: ${STUDENT_PROFILE_SVC_URI}
          predicates:
            - Path=/api/v1/students/**
        - id: study-plans
          uri: ${AI_MENTOR_SVC_URI}
          predicates:
            - Path=/api/v1/study-plans/**
        - id: reminders
          uri: ${AI_MENTOR_SVC_URI}
          predicates:
            - Path=/api/v1/reminders/**
        - id: doubts
          uri: ${AI_MENTOR_SVC_URI}
          predicates:
            - Path=/api/v1/doubts/**
        - id: recommendations
          uri: ${AI_MENTOR_SVC_URI}
          predicates:
            - Path=/api/v1/recommendations/**
        - id: exam-tracker-svc
          uri: ${EXAM_TRACKER_SVC_URI}
          predicates:
            - Path=/api/v1/exam-tracker/**
        - id: performance-svc
          uri: ${PERFORMANCE_SVC_URI}
          predicates:
            - Path=/api/v1/performance/**
        - id: career-oracle-profiles
          uri: ${CAREER_ORACLE_SVC_URI}
          predicates:
            - Path=/api/v1/career-profiles/**
        - id: career-oracle-recommendations
          uri: ${CAREER_ORACLE_SVC_URI}
          predicates:
            - Path=/api/v1/career-recommendations/**
        - id: career-oracle-colleges
          uri: ${CAREER_ORACLE_SVC_URI}
          predicates:
            - Path=/api/v1/college-predictions/**
        - id: mentor-svc
          uri: ${MENTOR_SVC_URI}
          predicates:
            - Path=/api/v1/mentors/**
        - id: mentor-sessions
          uri: ${MENTOR_SVC_URI}
          predicates:
            - Path=/api/v1/mentor-sessions/**
        - id: assess-svc-exams
          uri: ${ASSESS_SVC_URI}
          predicates:
            - Path=/api/v1/exams/**
        - id: assess-svc-questions
          uri: ${ASSESS_SVC_URI}
          predicates:
            - Path=/api/v1/questions/**
        - id: assess-svc-grades
          uri: ${ASSESS_SVC_URI}
          predicates:
            - Path=/api/v1/grades/**
        - id: psych-svc
          uri: ${PSYCH_SVC_URI}
          predicates:
            - Path=/api/v1/psych/**
        - id: ai-gateway-svc
          uri: ${AI_GATEWAY_SVC_URI}
          predicates:
            - Path=/api/v1/ai/**
        - id: notification-svc
          uri: ${NOTIFICATION_SVC_URI}
          predicates:
            - Path=/api/v1/notifications/**
        - id: nexus-chat-svc
          uri: ${NEXUS_CHAT_SVC_URI:http://localhost:8097}
          predicates:
            - Path=/api/v1/chat/**

server:
  port: ${API_GATEWAY_PORT}
  shutdown: graceful

# JWT (RS256 — JWKS fetched from auth-svc at startup, refreshed on TTL)
jwt:
  public-key-path: ${JWT_PUBLIC_KEY_PATH}
  issuer: ${JWT_ISSUER}
  jwks-uri: ${JWT_JWKS_URI}
  jwks-cache-ttl-seconds: ${JWT_JWKS_CACHE_TTL_SECONDS}

# Downstream service URIs (used in routes above)
services:
  auth-svc-uri: ${AUTH_SVC_URI}
  parent-svc-uri: ${PARENT_SVC_URI}
  center-svc-uri: ${CENTER_SVC_URI}
  assess-svc-uri: ${ASSESS_SVC_URI}
  psych-svc-uri: ${PSYCH_SVC_URI}
  ai-gateway-svc-uri: ${AI_GATEWAY_SVC_URI}
  notification-svc-uri: ${NOTIFICATION_SVC_URI}

resilience4j:
  circuitbreaker:
    instances:
      auth-svc:
        sliding-window-size: ${R4J_CB_AUTH_WINDOW_SIZE}
        failure-rate-threshold: ${R4J_CB_AUTH_FAILURE_THRESHOLD}
        wait-duration-in-open-state: ${R4J_CB_AUTH_WAIT_DURATION}

management:
  endpoints:
    web:
      exposure:
        include: ${ACTUATOR_ENDPOINTS}
  metrics:
    tags:
      application: ${API_GATEWAY_NAME}
      environment: ${APP_ENVIRONMENT}
  tracing:
    sampling:
      probability: ${OTEL_SAMPLING_PROBABILITY}

otel:
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT}

logging:
  level:
    root: ${LOG_LEVEL_ROOT}
    com.edutech: ${LOG_LEVEL_APP}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: auth-svc
        url: ${AUTH_SVC_URI}/api-docs
      - name: parent-svc
        url: ${PARENT_SVC_URI}/api-docs
      - name: center-svc
        url: ${CENTER_SVC_URI}/api-docs
      - name: assess-svc
        url: ${ASSESS_SVC_URI}/api-docs
      - name: psych-svc
        url: ${PSYCH_SVC_URI}/api-docs
      - name: notification-svc
        url: ${NOTIFICATION_SVC_URI}/api-docs

# ── Loki log aggregation (read by logback-spring.xml via springProperty) ──────
loki:
  url: ${LOKI_URL:http://localhost:3100}
log:
  dedup:
    allowed-repetitions: ${LOG_DEDUP_ALLOWED_REPETITIONS:5}
    cache-size: ${LOG_DEDUP_CACHE_SIZE:500}
